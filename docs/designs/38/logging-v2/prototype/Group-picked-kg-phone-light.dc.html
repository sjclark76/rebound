<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit weight group · picked in kg · phone · light</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="rebound-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="rb t-light" style="width: 390px; min-height: 990px">
<header class="hdr line">
<div class="hdr-in" style="padding-left: 8px; justify-content: flex-start">
<a class="back" href="#"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Dumbbell weights</a>
</div>
</header>
<main class="page">
<div class="sec-head">
<p class="kick">Dumbbell weights · Group 2 of 2</p>
<h1 class="hd title">Fixed dumbbells</h1>
</div>
<div class="fblock">
<label class="lbl" for="set-name">Name <span class="opt">(optional)</span></label>
<span class="field txt"><input id="set-name" type="text" value="Fixed dumbbells"></span>
</div>
<fieldset class="seg">
<legend class="sr">Kind of group</legend>
<label><input type="radio" name="mode">Range</label>
<label class="sel"><input type="radio" name="mode" checked><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Pick weights</label>
</fieldset>
<fieldset class="ublk" aria-describedby="unit-note">
<legend>Unit</legend>
<div class="useg"><label class="sel"><input type="radio" name="unit" value="kg" checked><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>kg</label><label><input type="radio" name="unit" value="lb">lb</label></div>
<p class="note" id="unit-note">As marked on this gear. Changing it relabels the numbers, so 20 kg becomes 20 lb.</p>
</fieldset>
<section class="blk" aria-labelledby="pick-h">
<div class="blk-h"><h2 class="hd" id="pick-h">Tap the weights in this group</h2><span class="count" role="status">2 selected</span></div>
<div class="picks">
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>20 kg</button>
<button type="button" class="pick" aria-pressed="false">22 kg</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>24 kg</button>
<button type="button" class="pick" aria-pressed="false">26 kg</button>
<button type="button" class="pick" aria-pressed="false">28 kg</button>
<button type="button" class="pick" aria-pressed="false">30 kg</button>
<button type="button" class="pick" aria-pressed="false">32 kg</button>
<button type="button" class="pick" aria-pressed="false">34 kg</button>
<button type="button" class="pick" aria-pressed="false">36 kg</button>
<button type="button" class="pick" aria-pressed="false">38 kg</button>
<button type="button" class="pick" aria-pressed="false">40 kg</button>
<button type="button" class="pick" aria-pressed="false">45 kg</button>
</div>
</section>
<div class="addrow">
<label class="field"><input type="text" inputmode="decimal" placeholder="Another weight" aria-label="Add a weight in kilograms">kg</label>
<button type="button" class="btn2 auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add</button>
</div>
<button type="button" class="btn-del"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Remove this group</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":990}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
