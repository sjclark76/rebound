<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dumbbell weights · lb tiles · phone · dark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="rebound-ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="rb t-dark" style="width: 390px; min-height: 844px">
<header class="hdr line">
<div class="hdr-in" style="padding-left: 8px; justify-content: flex-start">
<a class="back" href="#"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Settings</a>
</div>
</header>
<main class="page">
<div class="sec-head">
<p class="kick">Equipment · Free weights</p>
<h1 class="hd title">Dumbbell weights</h1>
<p class="lede">Tick each dumbbell you own, in the unit it's marked in. Changes save as you go.</p>
</div>
<div class="sum" role="status" aria-live="polite">
<span class="k">Selected · 4 weights</span>
<span class="v">20, 24 kg + 45, 50 lb</span>
</div>
<fieldset class="ublk" aria-describedby="tiles-note">
<legend>Show tiles in</legend>
<div class="useg"><label><input type="radio" name="tiles" value="kg">kg</label><label class="sel"><input type="radio" name="tiles" value="lb" checked><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>lb</label></div>
<p class="note" id="tiles-note">Ticked weights stay selected when you switch.</p>
</fieldset>
<section class="blk" aria-labelledby="pick-h">
<div class="blk-h"><h2 class="hd" id="pick-h">Tap the weights you own</h2><span class="count">2 in lb</span></div>
<div class="picks">
<button type="button" class="pick" aria-pressed="false">5 lb</button>
<button type="button" class="pick" aria-pressed="false">10 lb</button>
<button type="button" class="pick" aria-pressed="false">15 lb</button>
<button type="button" class="pick" aria-pressed="false">20 lb</button>
<button type="button" class="pick" aria-pressed="false">25 lb</button>
<button type="button" class="pick" aria-pressed="false">30 lb</button>
<button type="button" class="pick" aria-pressed="false">35 lb</button>
<button type="button" class="pick" aria-pressed="false">40 lb</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>45 lb</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>50 lb</button>
<button type="button" class="pick" aria-pressed="false">55 lb</button>
<button type="button" class="pick" aria-pressed="false">60 lb</button>
</div>
</section>
<div class="addrow">
<label class="field"><input type="text" inputmode="decimal" placeholder="Another weight" aria-label="Add a weight in pounds">lb</label>
<button type="button" class="btn2 auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
