<button type="button" class="ghost">Sign out</button>
</nav>

<main class="page wide mid">
<a class="back" style="align-self: flex-start; margin: 0 0 -16px -12px" href="Weights-sets-desktop-light.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Dumbbell weights</a>
<div class="sec-head">
<p class="kick">Dumbbell weights · Set 2 of 2</p>
<h1 class="hd title">Fixed dumbbells</h1>
</div>
<div class="fblock">
<label class="lbl" for="set-name">Name <span class="opt">(optional)</span></label>
<span class="field txt"><input id="set-name" type="text" value="Fixed dumbbells"></span>
</div>
<fieldset class="seg">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set type</legend>
<label><input type="radio" name="mode">Range</label>
<label class="sel"><input type="radio" name="mode" checked><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Pick weights</label>
</fieldset>
<section class="blk" aria-labelledby="pick-h">
<div class="blk-h"><h2 class="hd" id="pick-h">Tap the weights in this set</h2><span class="count" role="status">3 selected</span></div>
<div class="picks">
<button type="button" class="pick" aria-pressed="false">20 kg</button>
<button type="button" class="pick" aria-pressed="false">22 kg</button>
<button type="button" class="pick" aria-pressed="false">24 kg</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>26 kg</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>28 kg</button>
<button type="button" class="pick" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>30 kg</button>
<button type="button" class="pick" aria-pressed="false">32 kg</button>
<button type="button" class="pick" aria-pressed="false">34 kg</button>
<button type="button" class="pick" aria-pressed="false">36 kg</button>
<button type="button" class="pick" aria-pressed="false">38 kg</button>
<button type="button" class="pick" aria-pressed="false">40 kg</button>
<button type="button" class="pick" aria-pressed="false">45 kg</button>
</div>
</section>
<div class="addrow">
<label class="field"><input type="text" inputmode="decimal" placeholder="Another weight" aria-label="Add a weight in kilograms">kg</label>
<button type="button" class="btn2 auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Add</button>
</div>
<p class="note">20, 22 and 24 kg are already in Adjustable dumbbells, so they count once either way.</p>
<button type="button" class="btn-del"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Remove this set</button>
</main>
</div>
