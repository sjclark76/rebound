<helmet>

<div class="rb t-light" style="width: 390px; min-height: 860px">

<a class="back" href="Weights-sets-phone-light.dc.html"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Dumbbell weights</a>

<div class="sec-head">

<h1 class="hd title">Adjustable dumbbells</h1>

<div class="fblock">
<label class="lbl" for="set-name">Name <span class="opt">(optional)</span></label>
<span class="field txt"><input id="set-name" type="text" value="Adjustable dumbbells"></span>
</div>
<fieldset class="seg">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set type</legend>
<label class="sel"><input type="radio" name="mode" checked><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Range</label>
<label><input type="radio" name="mode">Pick weights</label>
</fieldset>
<ul class="card" aria-label="Range">
<li class="stp"><span class="lab" id="r-start">Start at</span><span class="ctl"><button type="button" class="sq56" aria-label="Lower start weight"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output aria-labelledby="r-start">2<small>kg</small></output><button type="button" class="sq56" aria-label="Raise start weight"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span></li>
<li class="stp"><span class="lab" id="r-step">Go up by</span><span class="ctl"><button type="button" class="sq56" aria-label="Smaller step"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output aria-labelledby="r-step">1<small>kg</small></output><button type="button" class="sq56" aria-label="Bigger step"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span></li>
<li class="stp"><span class="lab" id="r-end">Up to</span><span class="ctl"><button type="button" class="sq56" aria-label="Lower top weight"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output aria-labelledby="r-end">24<small>kg</small></output><button type="button" class="sq56" aria-label="Raise top weight"><svg class="ic lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span></li>
</ul>
<div class="sum" role="status">
<span class="k">In this set · 23 weights</span>
<span class="v" style="font-size: 18px; line-height: 24px">2, 3, 4, 5 … 22, 23, 24 kg</span>
</div>
<button type="button" class="btn-del"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Remove this set</button>
